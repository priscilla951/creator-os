<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator OS — Link-in-Bio CSS Theme Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .accent-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); }
    .phone-screen { aspect-ratio: 9 / 16; max-height: 560px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

  <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-xl accent-gradient flex items-center justify-center font-black text-xl text-white shadow-lg shadow-indigo-500/20">C</div>
        <div>
          <span class="font-bold text-lg tracking-tight">Creator<span class="text-indigo-400">OS</span></span>
          <span class="ml-2 text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 font-medium">Viral Lab</span>
        </div>
      </a>
      
      <div class="flex items-center gap-2 sm:gap-3">
        <select id="languageSelector" onchange="changeLanguage(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2.5 py-1.5 outline-none font-semibold cursor-pointer">
          <option value="en">🌐 English</option>
          <option value="es">🌐 Español</option>
          <option value="fr">🌐 Français</option>
        </select>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8 text-center max-w-3xl mx-auto">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-3">
        <span data-i18n="hero_title">One-Click "Link-in-Bio" CSS Theme Animator</span>
      </h1>
      <p class="text-slate-400 text-sm sm:text-base" data-i18n="hero_desc">
        Customize your viral mobile link page with animated CSS themes, social handles, and instant source code export.
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- Controls Column -->
      <div class="lg:col-span-5 space-y-6">
        <div class="glass-card p-6 rounded-2xl space-y-4">
          <h2 class="text-sm font-bold text-indigo-400 uppercase tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-code"></i> <span data-i18n="input_heading">1. Profile & Theme Setup</span>
          </h2>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1" data-i18n="name_label">Creator Name / Handle</label>
            <input type="text" id="creatorName" value="@creator_os" oninput="updateBioPreview()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1" data-i18n="theme_label">Visual Aesthetic Theme</label>
            <select id="themeSelect" onchange="updateBioPreview()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 outline-none">
              <option value="cyberpunk">Cyberpunk Neon (Dark & Glowing)</option>
              <option value="y2k">Y2K Chrome & Metallic</option>
              <option value="minimalist" selected>Minimalist Glassmorphism</option>
              <option value="brutalism">Brutalism High-Contrast</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1" data-i18n="links_label">Primary Button Links (Title | URL)</label>
            <textarea id="linksInput" rows="3" oninput="updateBioPreview()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl p-3 outline-none font-mono">Latest YouTube Masterclass | #
Join Discord Community | #
Download Free Creator OS | #</textarea>
          </div>

          <button onclick="copyBioCode()" class="w-full py-3 rounded-xl accent-gradient text-white font-bold text-sm shadow-lg shadow-indigo-500/20 hover:opacity-95 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-copy"></i> <span data-i18n="copy_btn">Copy HTML & CSS Code</span>
          </button>
        </div>
      </div>

      <!-- Live Phone Preview Column -->
      <div class="lg:col-span-7 flex justify-center">
        <div id="phoneWrapper" class="p-4 rounded-3xl border border-slate-700 shadow-2xl relative w-full max-w-sm phone-screen flex flex-col items-center justify-start overflow-y-auto transition-all bg-slate-900" style="background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);">
          
          <!-- Avatar -->
          <div class="h-16 w-16 rounded-full accent-gradient flex items-center justify-center text-white font-black text-2xl shadow-lg mt-4 mb-2 border-2 border-white/20">C</div>
          
          <!-- Handle -->
          <h3 id="previewHandle" class="text-sm font-extrabold tracking-tight text-white mb-6">@creator_os</h3>

          <!-- Links Container -->
          <div id="previewLinksContainer" class="w-full space-y-3 px-4">
            <!-- Dynamically populated -->
          </div>

          <!-- CreatorOS Attribution Footer -->
          <div class="mt-auto py-4 text-center">
            <span class="text-[10px] tracking-widest text-slate-400 uppercase font-semibold">Engineered by CreatorOS</span>
          </div>

        </div>
      </div>

    </div>
  </main>

  <script>
    const i18n = {
      en: {
        hero_title: 'One-Click "Link-in-Bio" CSS Theme Animator',
        hero_desc: 'Customize your viral mobile link page with animated CSS themes, social handles, and instant source code export.',
        input_heading: '1. Profile & Theme Setup',
        name_label: 'Creator Name / Handle',
        theme_label: 'Visual Aesthetic Theme',
        links_label: 'Primary Button Links (Title | URL)',
        copy_btn: 'Copy HTML & CSS Code'
      },
      es: {
        hero_title: 'Generador de Temas CSS para Link-in-Bio',
        hero_desc: 'Personaliza tu página de enlaces móviles con temas CSS animados.',
        input_heading: '1. Configuración de Perfil',
        name_label: 'Nombre o Alias del Creador',
        theme_label: 'Tema Estético Visual',
        links_label: 'Enlaces de Botones (Título | URL)',
        copy_btn: 'Copiar Código HTML y CSS'
      },
      fr: {
        hero_title: 'Générateur de Thèmes CSS Link-in-Bio',
        hero_desc: 'Personnalisez votre page de liens mobile avec des thèmes CSS animés.',
        input_heading: '1. Paramètres du Profil',
        name_label: 'Nom / Identifiant du Créateur',
        theme_label: 'Thème Esthétique Visuel',
        links_label: 'Liens des Boutons (Titre | URL)',
        copy_btn: 'Copier le Code HTML & CSS'
      }
    };

    function updateBioPreview() {
      const name = document.getElementById('creatorName').value.trim() || '@creator';
      const theme = document.getElementById('themeSelect').value;
      const rawLinks = document.getElementById('linksInput').value.trim().split('\n');

      document.getElementById('previewHandle').innerText = name;

      const container = document.getElementById('previewLinksContainer');
      container.innerHTML = '';

      rawLinks.forEach(line => {
        const parts = line.split('|');
        const title = parts[0] ? parts[0].trim() : 'Link Item';
        const url = parts[1] ? parts[1].trim() : '#';

        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.innerText = title;

        // Apply Theme Styles
        if (theme === 'cyberpunk') {
          a.className = "block w-full py-3 px-4 rounded-xl text-center text-xs font-bold bg-slate-950 text-cyan-400 border border-cyan-500/50 shadow-lg shadow-cyan-500/20 hover:bg-cyan-500 hover:text-slate-950 transition";
          document.getElementById('phoneWrapper').style.background = '#030712';
        } else if (theme === 'y2k') {
          a.className = "block w-full py-3 px-4 rounded-xl text-center text-xs font-bold bg-gradient-to-r from-slate-200 via-slate-100 to-slate-300 text-slate-900 border border-white shadow-xl hover:scale-105 transition";
          document.getElementById('phoneWrapper').style.background = 'radial-gradient(circle at center, #312e81 0%, #030712 100%)';
        } else if (theme === 'brutalism') {
          a.className = "block w-full py-3 px-4 rounded-none text-center text-xs font-black bg-yellow-400 text-black border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-x-1 hover:translate-y-1 transition";
          document.getElementById('phoneWrapper').style.background = '#f8fafc';
        } else { // minimalist
          a.className = "block w-full py-3 px-4 rounded-2xl text-center text-xs font-semibold bg-white/10 backdrop-blur-md text-white border border-white/10 hover:bg-white/20 transition shadow-lg";
          document.getElementById('phoneWrapper').style.background = 'radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%)';
        }

        container.appendChild(a);
      });
    }

    function copyBioCode() {
      const codeSnippet = `<!-- Powered by CreatorOS Link-in-Bio Generator -->\n<div style="font-family:sans-serif; background:#0f172a; padding:20px; text-align:center;">\n  <h2>${document.getElementById('creatorName').value}</h2>\n  <p>Engineered by CreatorOS</p>\n</div>`;
      navigator.clipboard.writeText(codeSnippet).then(() => {
        alert('Link-in-Bio template code copied to clipboard!');
      });
    }

    function changeLanguage(langKey) {
      const dict = i18n[langKey] || i18n.en;
      document.querySelectorAll('[data-i18n]').forEach(element => {
        const key = element.getAttribute('data-i18n');
        if (dict[key]) element.innerText = dict[key];
      });
      localStorage.setItem('creator_os_lang', langKey);
    }

    window.onload = function() {
      const savedLang = localStorage.getItem('creator_os_lang') || 'en';
      document.getElementById('languageSelector').value = savedLang;
      changeLanguage(savedLang);
      updateBioPreview();
    };
  </script>
</body>
</html>
