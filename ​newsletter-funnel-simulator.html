<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator OS - Newsletter Funnel Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white pb-16">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 pt-6">
        
        <!-- Header with Logo and Language Switcher -->
        <header class="flex items-center justify-between bg-slate-900/90 border border-slate-800 p-4 rounded-2xl shadow-xl mb-6">
            <div class="flex items-center gap-3">
                <!-- Creator OS Logo Icon -->
                <a href="index.html" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-violet-600 via-indigo-600 to-fuchsia-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 hover:opacity-90 transition-opacity">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                    </svg>
                </a>
                <div>
                    <h1 class="text-lg font-black tracking-tight text-white" data-i18n="title">Newsletter Funnel Simulator</h1>
                    <p class="text-xs text-slate-400 font-medium" data-i18n="subtitle">Track subscriber growth conversion milestones and email monetization funnels.</p>
                </div>
            </div>

            <!-- Language Switcher -->
            <div class="relative">
                <select id="languageSelect" onchange="changeLanguage(this.value)" class="bg-slate-950 border border-slate-800 text-xs font-bold text-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="pt">Português</option>
                </select>
            </div>
        </header>

        <!-- Main Simulator Card -->
        <div class="bg-slate-900/80 border border-slate-800 p-6 sm:p-8 rounded-3xl shadow-xl space-y-6">
            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2" data-i18n="lblTraffic">Monthly Traffic / Visitors</label>
                    <input type="number" id="traffic" value="10000" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2" data-i18n="lblConversion">Opt-in Conversion Rate (%)</label>
                    <input type="number" id="conversion" value="5" step="0.1" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2" data-i18n="lblSponsor">Monthly Sponsor Price per Subscriber ($)</label>
                    <input type="number" id="sponsorRate" value="0.05" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2" data-i18n="lblChurn">Monthly Churn Rate (%)</label>
                    <input type="number" id="churn" value="2" step="0.1" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <button onclick="calculateFunnel()" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/25 transition-all text-sm" data-i18n="btnSimulate">
                Simulate Funnel Metrics
            </button>

            <!-- Results Panel -->
            <div class="grid gap-4 sm:grid-cols-3 pt-4 border-t border-slate-800">
                <div class="bg-slate-950/60 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <span class="text-xs font-medium text-slate-400 block mb-1" data-i18n="resNew">New Subscribers / Mo</span>
                    <span id="newSubs" class="text-xl font-black text-indigo-400">500</span>
                </div>
                <div class="bg-slate-950/60 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <span class="text-xs font-medium text-slate-400 block mb-1" data-i18n="resActive">Active List Size</span>
                    <span id="listSize" class="text-xl font-black text-white">4,900</span>
                </div>
                <div class="bg-slate-950/60 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <span class="text-xs font-medium text-slate-400 block mb-1" data-i18n="resRev">Estimated Monthly Revenue</span>
                    <span id="rev" class="text-xl font-black text-emerald-400">$245.00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                title: "Newsletter Funnel Simulator",
                subtitle: "Track subscriber growth conversion milestones and email monetization funnels.",
                lblTraffic: "Monthly Traffic / Visitors",
                lblConversion: "Opt-in Conversion Rate (%)",
                lblSponsor: "Monthly Sponsor Price per Subscriber ($)",
                lblChurn: "Monthly Churn Rate (%)",
                btnSimulate: "Simulate Funnel Metrics",
                resNew: "New Subscribers / Mo",
                resActive: "Active List Size",
                resRev: "Estimated Monthly Revenue"
            },
            es: {
                title: "Simulador de Embudo de Newsletter",
                subtitle: "Rastree hitos de conversión de crecimiento y embudos de monetización.",
                lblTraffic: "Tráfico / Visitantes Mensuales",
                lblConversion: "Tasa de Conversión de Suscripción (%)",
                lblSponsor: "Precio Mensual por Patrocinio / Suscriptor ($)",
                lblChurn: "Tasa de Cancelación Mensual (%)",
                btnSimulate: "Simular Métricas del Embudo",
                resNew: "Nuevos Suscriptores / Mes",
                resActive: "Tamaño de Lista Activa",
                resRev: "Ingresos Mensuales Estimados"
            },
            fr: {
                title: "Simulateur d'Entonnoir Newsletter",
                subtitle: "Suivez la croissance des abonnés et les entonnoirs de monétisation.",
                lblTraffic: "Trafic / Visiteurs Mensuels",
                lblConversion: "Taux de Conversion d'Inscription (%)",
                lblSponsor: "Prix Mensuel du Sponsor par Abonné ($)",
                lblChurn: "Taux de Désabonnement Mensuel (%)",
                btnSimulate: "Simuler les Métriques",
                resNew: "Nouveaux Abonnés / Mois",
                resActive: "Taille de la Liste Active",
                resRev: "Revenu Mensuel Estimé"
            },
            pt: {
                title: "Simulador de Funil de Newsletter",
                subtitle: "Acompanhe marcos de crescimento de inscritos e funis de monetização.",
                lblTraffic: "Tráfego / Visitantes Mensais",
                lblConversion: "Taxa de Conversão de Inscrição (%)",
                lblSponsor: "Preço Mensal por Patrocínio por Inscrito ($)",
                lblChurn: "Taxa de Cancelamento Mensal (%)",
                btnSimulate: "Simular Métricas do Funil",
                resNew: "Novos Inscritos / Mês",
                resActive: "Tamanho da Lista Ativa",
                resRev: "Receita Mensal Estimada"
            }
        };

        function changeLanguage(lang) {
            const t = translations[lang];
            if (!t) return;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
        }

        function calculateFunnel() {
            const traffic = parseFloat(document.getElementById('traffic').value) || 0;
            const conversion = parseFloat(document.getElementById('conversion').value) || 0;
            const sponsorRate = parseFloat(document.getElementById('sponsorRate').value) || 0;
            const churn = parseFloat(document.getElementById('churn').value) || 0;

            const newSubs = traffic * (conversion / 100);
            const lostSubs = newSubs * (churn / 100);
            const activeList = Math.max(0, Math.round(newSubs - lostSubs));
            const monthlyRevenue = activeList * sponsorRate;

            document.getElementById('newSubs').textContent = Math.round(newSubs).toLocaleString();
            document.getElementById('listSize').textContent = activeList.toLocaleString();
            document.getElementById('rev').textContent = "$" + monthlyRevenue.toFixed(2);
        }
    </script>
</body>
</html>
