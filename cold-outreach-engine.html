<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator OS — Brand Outreach & Cold Follow-Up Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .accent-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

  <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-xl accent-gradient flex items-center justify-center font-black text-xl text-white shadow-lg shadow-indigo-500/20">C</div>
        <div>
          <span class="font-bold text-lg tracking-tight">Creator<span class="text-indigo-400">OS</span></span>
          <span class="ml-2 text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">Outreach Engine</span>
        </div>
      </a>
      
      <div class="flex items-center gap-2 sm:gap-3">
        <select id="languageSelector" onchange="changeLanguage(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2.5 py-1.5 outline-none font-semibold cursor-pointer">
          <option value="en">🌐 English</option>
          <option value="es">🌐 Español</option>
          <option value="fr">🌐 Français</option>
        </select>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8 text-center max-w-3xl mx-auto">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-3">
        <span data-i18n="hero_title">Brand Outreach & Cold Follow-Up Engine</span>
      </h1>
      <p class="text-slate-400 text-sm sm:text-base" data-i18n="hero_desc">
        Generate customized cold emails, incoming inquiry replies, and follow-up templates optimized for brand deal conversions.
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <div class="lg:col-span-5 space-y-6">
        <div class="glass-card p-6 rounded-2xl space-y-4">
          <h2 class="text-sm font-bold text-indigo-400 uppercase tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> <span data-i18n="input_heading">1. Pitch Parameters</span>
          </h2>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1" data-i18n="template_type">Email Objective</label>
            <select id="templateType" onchange="generatePitch()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 outline-none">
              <option value="cold">Cold Pitch to Target Brand</option>
              <option value="inbound">Inbound Inquiry Response (Rate Delivery)</option>
              <option value="followup">Polite 5-Day Follow-Up</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1" data-i18n="brand_name">Target Brand Name</label>
            <input type="text" id="brandNameInput" value="Notion" oninput="generatePitch()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1" data-i18n="creator_niche">Your Niche / Content Category</label>
            <input type="text" id="nicheInput" value="Tech & Productivity" oninput="generatePitch()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1" data-i18n="avg_views">Average Audience Reach / Views</label>
            <input type="text" id="reachInput" value="35,000 monthly views" oninput="generatePitch()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 outline-none">
          </div>
        </div>
      </div>

      <div class="lg:col-span-7 space-y-6">
        <div class="glass-card p-6 rounded-2xl border-indigo-500/35 sticky top-20 shadow-2xl space-y-4">
          <div class="flex items-center justify-between pb-3 border-b border-slate-800">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider" data-i18n="summary_title">Generated Pitch Copy</span>
            <button onclick="copyToClipboard()" class="text-xs px-3 py-1.5 rounded-lg bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-semibold hover:bg-indigo-500/30 transition flex items-center gap-1.5">
              <i class="fa-solid fa-copy"></i> <span data-i18n="copy_btn">Copy Script</span>
            </button>
          </div>

          <div class="bg-slate-900/90 rounded-xl p-4 border border-slate-800 text-slate-200 font-mono text-xs leading-relaxed overflow-x-auto min-h-[300px]" id="pitchOutput">
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    const i18n = {
      en: {
        hero_title: "Brand Outreach & Cold Follow-Up Engine",
        hero_desc: "Generate customized cold emails, incoming inquiry replies, and follow-up templates optimized for brand deal conversions.",
        input_heading: "1. Pitch Parameters",
        template_type: "Email Objective",
        brand_name: "Target Brand Name",
        creator_niche: "Your Niche / Content Category",
        avg_views: "Average Audience Reach / Views",
        summary_title: "Generated Pitch Copy",
        copy_btn: "Copy Script"
      },
      es: {
        hero_title: "Motor de Alcance y Seguimiento de Marcas",
        hero_desc: "Genere correos de propuesta y seguimiento personalizados para patrocinadores.",
        input_heading: "1. Parámetros del Mensaje",
        template_type: "Objetivo del Correo",
        brand_name: "Nombre de la Marca",
        creator_niche: "Nicho de Contenido",
        avg_views: "Alcance Promedio de Audiencia",
        summary_title: "Copia Generada",
        copy_btn: "Copiar Texto"
      },
      fr: {
        hero_title: "Moteur de Démarchage & Relances Marque",
        hero_desc: "Générez des e-mails de démarchage et des relances personnalisés pour vos partenariats.",
        input_heading: "1. Paramètres du Pitch",
        template_type: "Objectif de l'E-mail",
        brand_name: "Nom de la Marque",
        creator_niche: "Niche de Contenu",
        avg_views: "Portée Moyenne du Public",
        summary_title: "Copie Générée",
        copy_btn: "Copier le Texte"
      }
    };

    function generatePitch() {
      const type = document.getElementById('templateType').value;
      const brand = document.getElementById('brandNameInput').value.trim() || 'your brand';
      const niche = document.getElementById('nicheInput').value.trim() || 'my category';
      const reach = document.getElementById('reachInput').value.trim() || 'our audience';

      let text = '';

      if (type === 'cold') {
        text = `Subject: Partnership Idea: ${brand} x My Channel (${reach})\n\nHi [Brand Manager Name],\n\nI’ve been a genuine user of ${brand} for a while now and frequently feature workflows around it in my ${niche} content.\n\nI run a creator channel generating over ${reach} composed of highly engaged professionals looking for better software & productivity tools.\n\nI'm currently planning my content calendar for next month and would love to introduce ${brand} to my community via an integrated mid-roll segment or dedicated integration.\n\nWould you be open to seeing our media kit and rate card?\n\nBest,\n[Your Name]`;
      } else if (type === 'inbound') {
        text = `Subject: Re: Sponsorship Inquiry — ${brand}\n\nHi [Sender Name],\n\nThanks for reaching out! We’d love to explore a partnership with ${brand}.\n\nOur platform reaches ${reach} within the ${niche} space with high audience intent and trust.\n\nHere is our current media kit and standard deliverables rate card:\n- 60s Dedicated Mid-roll Segment: [Insert Rate]\n- Multi-Platform Bundle (YouTube + Shorts/Social): [Insert Rate]\n\nLet me know which option aligns best with your team's campaign goals and we can draft a formal agreement.\n\nBest regards,\n[Your Name]`;
      } else if (type === 'followup') {
        text = `Subject: Re: Partnership Idea: ${brand} x My Channel\n\nHi [Sender Name],\n\nJust following up on my previous note regarding a potential partnership with ${brand}.\n\nWe are wrapping up brand integrations for our upcoming quarterly schedule and would love to save a slot for ${brand} if you're actively running campaigns right now.\n\nLet me know if you'd like me to send over our media kit!\n\nBest,\n[Your Name]`;
      }

      document.getElementById('pitchOutput').innerText = text;
    }

    function copyToClipboard() {
      const text = document.getElementById('pitchOutput').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('Pitch script copied to clipboard!');
      });
    }

    function changeLanguage(langKey) {
      const dict = i18n[langKey] || i18n.en;
      document.querySelectorAll('[data-i18n]').forEach(element => {
        const key = element.getAttribute('data-i18n');
        if (dict[key]) element.innerText = dict[key];
      });
      localStorage.setItem('creator_os_lang', langKey);
    }

    window.onload = function() {
      const savedLang = localStorage.getItem('creator_os_lang') || 'en';
      document.getElementById('languageSelector').value = savedLang;
      changeLanguage(savedLang);
      generatePitch();
    };
  </script>
</body>
</html>
